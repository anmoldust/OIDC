services:
  # ──────────────────────────────────────────────────────────
  #  PostgreSQL Database
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oidc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       oidcdb
      POSTGRES_USER:     oidcuser
      POSTGRES_PASSWORD: oidcpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oidcuser -d oidcdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oidc-network

  # ──────────────────────────────────────────────────────────
  #  Keycloak Identity Provider
  # ──────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: oidc-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT:            8180
      KC_HOSTNAME_STRICT:      "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL:            INFO
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8180 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - oidc-network

  # ──────────────────────────────────────────────────────────
  #  Spring Boot Backend
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oidc-backend
    restart: unless-stopped
    environment:
      SERVER_PORT:          8080
      DB_URL:               jdbc:postgresql://postgres:5432/oidcdb
      DB_USERNAME:          oidcuser
      DB_PASSWORD:          oidcpass
      DB_DDL_AUTO:          update
      KEYCLOAK_ISSUER_URI:          http://localhost:8180/realms/oidc-demo
      KEYCLOAK_INTERNAL_ISSUER_URI: http://keycloak:8180/realms/oidc-demo
      KEYCLOAK_JWK_SET_URI:         http://keycloak:8180/realms/oidc-demo/protocol/openid-connect/certs
      KEYCLOAK_URL:         http://keycloak:8180
      KEYCLOAK_REALM:       oidc-demo
      KEYCLOAK_CLIENT_ID:   oidc-backend
      KEYCLOAK_CLIENT_SECRET: change-me-in-production
      FRONTEND_URL:         http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - oidc-network

  # ──────────────────────────────────────────────────────────
  #  React Frontend (Nginx)
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oidc-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oidc-network

  # ──────────────────────────────────────────────────────────
  #  Prometheus Metrics Scraper
  # ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: oidc-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - oidc-network

  # ──────────────────────────────────────────────────────────
  #  Grafana Dashboard
  # ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: oidc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - oidc-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  oidc-network:
    driver: bridge
