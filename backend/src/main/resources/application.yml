# ============================================================
#  Application
# ============================================================
spring:
  application:
    name: oidc-backend

# ============================================================
#  Database — PostgreSQL
# ============================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oidcdb}
    username: ${DB_USERNAME:oidcuser}
    password: ${DB_PASSWORD:oidcpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OidcHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}      # auto-create/update tables for dev/docker
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

# ============================================================
#  OAuth2 — Keycloak Resource Server (JWT) + OAuth2 Login
# ============================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/oidc-demo}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/oidc-demo/protocol/openid-connect/certs}

      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:oidc-backend}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:change-me-in-production}
            scope: openid,profile,email,roles
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_INTERNAL_ISSUER_URI:http://keycloak:8180/realms/oidc-demo}
            user-name-attribute: preferred_username

# ============================================================
#  Server
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: LAX
        max-age: 1800s
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: never
    include-stacktrace: never

# ============================================================
#  Actuator
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# ============================================================
#  SpringDoc / Swagger
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:oidc-backend}
      use-pkce-with-authorization-code-grant: true
  show-actuator: false

# ============================================================
#  Keycloak (custom properties for OpenAPI config)
# ============================================================
keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:oidc-demo}

# ============================================================
#  Application Custom Properties
# ============================================================
app:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - ${FRONTEND_URL:http://localhost:5173}

# ============================================================
#  Logging
# ============================================================
logging:
  level:
    root: INFO
    com.oidcdemo: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
