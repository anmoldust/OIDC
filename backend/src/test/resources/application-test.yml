# Test profile — uses H2 in-memory database, mocked OAuth2
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # Use a static JWK for tests (spring-security-test provides MockJwt)
          issuer-uri: http://localhost/realms/test

app:
  allowed-origins:
    - http://localhost:5173

keycloak:
  auth-server-url: http://localhost
  realm: test

logging:
  level:
    root: WARN
    com.oidcdemo: DEBUG
